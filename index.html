<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Browser CS Prototype - Advanced Graphics</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; background-color: #000; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); pointer-events: none; }
        .ch-line { position: absolute; background: #0f0; box-shadow: 0 0 4px #0f0; }
        .ch-h { width: 100%; height: 2px; top: 9px; }
        .ch-v { height: 100%; width: 2px; left: 9px; }
        
        #hud-bottom { padding: 20px; display: flex; justify-content: space-between; color: white; text-shadow: 2px 2px 4px black; font-size: 28px; font-weight: bold; }
        #ammo-box { background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 5px; border-left: 4px solid #ff9900; }
        #health-box { background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 5px; color: #ff4444; border-left: 4px solid #ff4444; }
        
        #menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 10; }
        h1 { color: #ff9900; font-size: 48px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,153,0,0.3); }
        .panel { background: #1a1a1a; padding: 30px; border-radius: 10px; border: 1px solid #333; text-align: center; color: white; max-width: 500px; width: 100%; box-sizing: border-box; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .control-group { margin: 20px 0; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #aaa; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        select, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 5px; border: none; font-size: 16px; cursor: pointer; box-sizing: border-box; }
        select { background: #2b2b2b; color: white; border: 1px solid #444; }
        select:focus { border-color: #ff9900; outline: none; }
        button.start-btn { background: #ff9900; color: black; font-weight: bold; transition: 0.2s; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
        button.start-btn:hover { background: #ffb733; transform: scale(1.02); box-shadow: 0 0 15px rgba(255,153,0,0.4); }
        
        #reload-msg { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); color: #ff4444; font-size: 22px; font-weight: bold; display: none; text-shadow: 2px 2px 4px black; letter-spacing: 1px; }
        #kill-feed { position: absolute; top: 20px; right: 20px; text-align: right; color: white; text-shadow: 1px 1px 2px black; font-size: 16px; font-weight: bold; }
        .feed-item { margin-bottom: 5px; opacity: 1; transition: opacity 2s; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 3px; border-right: 4px solid #0f0; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="kill-feed"></div>
    <div id="crosshair">
        <div class="ch-line ch-h"></div>
        <div class="ch-line ch-v"></div>
    </div>
    <div id="reload-msg">НАЖМИТЕ 'R' ДЛЯ ПЕРЕЗАРЯДКИ</div>
    <div id="hud-bottom">
        <div id="health-box">HP: <span id="hp-val">100</span></div>
        <div id="ammo-box"><span id="ammo-val">30</span> / <span id="reserve-val">90</span></div>
    </div>
</div>

<div id="menu-overlay">
    <div class="panel" id="main-menu">
        <h1>CS: WEB PROTOTYPE</h1>
        
        <div class="control-group">
            <label>Карта</label>
            <select id="map-select">
                <option value="dust2_style">Dust II Style (Пустыня)</option>
                <option value="ice_style">Ice Map (Лед)</option>
                <option value="city_style">City Block (Город)</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Скин оружия</label>
            <select id="skin-select">
                <option value="default">Стандарт (Черный)</option>
                <option value="gold">Золотой Дракон</option>
                <option value="neon">Неон Киберпанк</option>
                <option value="camo">Лесной Камуфляж</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Сложность ботов</label>
            <select id="difficulty-select">
                <option value="easy">Легкая (Медленные, неточные)</option>
                <option value="medium" selected>Средняя (Нормальные)</option>
                <option value="hard">Сложная (Быстрые, снайперы)</option>
            </select>
        </div>
        
        <button class="start-btn" onclick="startGame()">В БОЙ</button>
        <p style="font-size: 12px; color: #666; margin-top: 15px;">WASD - Ходьба | ЛКМ - Огонь | R - Перезарядка | ESC - Меню</p>
    </div>

    <div class="panel" id="game-over-menu" style="display: none;">
        <h1 id="end-title">ИГРА ОКОНЧЕНА</h1>
        <p id="end-reason"></p>
        <button class="start-btn" onclick="location.reload()">В МЕНЮ</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

<script>
    // --- Game Configuration & State ---
    let camera, scene, renderer, controls;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let canJump = false;
    let prevTime = performance.now();
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    
    // Game State
    let isGameActive = false;
    let playerHealth = 100;
    let currentAmmo = 30;
    let reserveAmmo = 90;
    let maxAmmo = 30;
    let isReloading = false;
    let bots = [];
    let obstacles = [];
    
    // VFX & Weapon Animation Options
    let gunMesh, muzzleFlash;
    let bobTime = 0;

    // Settings
    let botDifficulty = 'medium';
    let mapType = 'dust2_style';
    let weaponSkin = 'default';

    // Constants
    const PLAYER_HEIGHT = 1.8;
    const PLAYER_SPEED = 80.0;

    // DOM Elements
    let uiAmmo, uiReserve, uiHP, reloadMsg, menuOverlay, mainMenu, gameOverMenu, killFeed;

    function init() {
        uiAmmo = document.getElementById('ammo-val');
        uiReserve = document.getElementById('reserve-val');
        uiHP = document.getElementById('hp-val');
        reloadMsg = document.getElementById('reload-msg');
        menuOverlay = document.getElementById('menu-overlay');
        mainMenu = document.getElementById('main-menu');
        gameOverMenu = document.getElementById('game-over-menu');
        killFeed = document.getElementById('kill-feed');

        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        controls = new THREE.PointerLockControls(camera, document.body);
        
        controls.addEventListener('lock', () => {
            isGameActive = true;
            if (menuOverlay) menuOverlay.style.display = 'none';
        });
        
        controls.addEventListener('unlock', () => {
            if(playerHealth > 0 && isGameActive) {
                isGameActive = false;
                if (mainMenu) mainMenu.style.display = 'block';
                if (gameOverMenu) gameOverMenu.style.display = 'none';
                if (menuOverlay) menuOverlay.style.display = 'flex';
            }
        });

        scene.add(controls.getObject());

        const onKeyDown = function (event) {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = true; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                case 'ArrowRight': case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump === true) velocity.y += 150; canJump = false; break;
                case 'KeyR': reloadWeapon(); break;
            }
        };

        const onKeyUp = function (event) {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = false; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                case 'ArrowRight': case 'KeyD': moveRight = false; break;
            }
        };

        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);
        document.addEventListener('mousedown', () => { if(isGameActive && !isReloading) shoot(); });

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        window.addEventListener('resize', onWindowResize);
        
        animate();
    }

    function startGame() {
        if (!controls) return;

        controls.lock();
        if (menuOverlay) menuOverlay.style.display = 'none';
        isGameActive = true;

        mapType = document.getElementById('map-select').value;
        weaponSkin = document.getElementById('skin-select').value;
        botDifficulty = document.getElementById('difficulty-select').value;

        playerHealth = 100;
        currentAmmo = maxAmmo;
        reserveAmmo = 90;
        isReloading = false;
        bots = [];
        obstacles = []; 
        updateHUD();
        
        while(scene.children.length > 0){ 
            scene.remove(scene.children[0]); 
        }

        // Улучшенное освещение для красивых теней
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(40, 80, 40);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 250;
        const d = 100;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        scene.add(controls.getObject());

        buildMap();
        spawnBots();
        createWeaponModel();
    }

    // Генерация процедурной текстуры сетки для земли (чтобы графика была четче)
    function createGridTexture(color1, color2) {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = color1;
        ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = color2;
        ctx.lineWidth = 4;
        ctx.strokeRect(0, 0, 256, 256);
        
        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(40, 40);
        return texture;
    }

    function buildMap() {
        let floorColor1, floorColor2, fogColor, wallColor;
        
        if(mapType === 'dust2_style') { 
            floorColor1 = '#e6c288'; floorColor2 = '#c2a876'; fogColor = 0xE6C288; wallColor = 0xd9b477;
        } else if(mapType === 'ice_style') { 
            floorColor1 = '#ddf0ff'; floorColor2 = '#b0d8f8'; fogColor = 0xDEEEFA; wallColor = 0xffffff;
        } else { 
            floorColor1 = '#222222'; floorColor2 = '#333333'; fogColor = 0x111111; wallColor = 0x444444;
        }

        scene.background = new THREE.Color(fogColor);
        scene.fog = new THREE.FogExp2(fogColor, 0.015);

        // Земля с красивой сеткой
        const floorGeo = new THREE.PlaneGeometry(300, 300);
        const floorMat = new THREE.MeshStandardMaterial({ 
            map: createGridTexture(floorColor1, floorColor2),
            roughness: 0.8 
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Препятствия (коробки и стены)
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const boxMat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.5 });

        const positions = [
            {x: 15, z: 15, w: 6, h: 5, d: 6}, {x: -20, z: 25, w: 12, h: 4, d: 4},
            {x: 30, z: -15, w: 4, h: 6, d: 14}, {x: -25, z: -25, w: 10, h: 5, d: 10},
            {x: 0, z: 45, w: 30, h: 8, d: 4}, {x: 0, z: -45, w: 4, h: 8, d: 30},
            {x: 40, z: 40, w: 8, h: 4, d: 8}, {x: -40, z: -40, w: 8, h: 4, d: 8}
        ];

        positions.forEach(pos => {
            const mesh = new THREE.Mesh(boxGeo, boxMat);
            mesh.position.set(pos.x, pos.h/2, pos.z);
            mesh.scale.set(pos.w, pos.h, pos.d);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            obstacles.push(new THREE.Box3().setFromObject(mesh));
        });
        
        controls.getObject().position.set(0, PLAYER_HEIGHT, 0);
        velocity.set(0,0,0);
    }

    function createWeaponModel() {
        for (let i = camera.children.length - 1; i >= 0; i--) {
            camera.remove(camera.children[i]);
        }

        gunMesh = new THREE.Group();
        
        let color = 0x111111;
        if(weaponSkin === 'gold') color = 0xFFD700;
        if(weaponSkin === 'neon') color = 0x00ffff;
        if(weaponSkin === 'camo') color = 0x355e3b;

        const bodyGeo = new THREE.BoxGeometry(0.08, 0.12, 0.5);
        const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.castShadow = true;
        gunMesh.add(body);
        
        const barrelGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.3);
        const barrelMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 });
        const barrel = new THREE.Mesh(barrelGeo, barrelMat);
        barrel.rotation.x = Math.PI / 2;
        barrel.position.set(0, 0.03, -0.35);
        gunMesh.add(barrel);

        // Вспышка при выстреле
        const flashGeo = new THREE.SphereGeometry(0.06, 8, 8);
        const flashMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0 });
        muzzleFlash = new THREE.Mesh(flashGeo, flashMat);
        muzzleFlash.position.set(0, 0.03, -0.55);
        gunMesh.add(muzzleFlash);

        // Позиционируем оружие на экране справа внизу
        gunMesh.position.set(0.25, -0.25, -0.5);
        camera.add(gunMesh);
    }

    function spawnBots() {
        const count = 6;
        
        for(let i=0; i<count; i++) {
            // Создаем составного человекоподобного бота из группы мешей
            const botGroup = new THREE.Group();

            // Материалы для одежды (Террористы / Спецназ визуально)
            const clothesMat = new THREE.MeshStandardMaterial({ color: mapType === 'dust2_style' ? 0x994d00 : 0x2244aa, roughness: 0.7 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });

            // Торс
            const torsoGeo = new THREE.BoxGeometry(0.7, 0.9, 0.4);
            const torso = new THREE.Mesh(torsoGeo, clothesMat);
            torso.position.y = 1.15;
            torso.castShadow = true;
            botGroup.add(torso);

            // Голова
            const headGeo = new THREE.BoxGeometry(0.35, 0.35, 0.35);
            const head = new THREE.Mesh(headGeo, skinMat);
            head.position.y = 1.75;
            head.castShadow = true;
            botGroup.add(head);

            // Очки / Маска для грозного вида
            const visorGeo = new THREE.BoxGeometry(0.38, 0.1, 0.36);
            const visorMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const visor = new THREE.Mesh(visorGeo, visorMat);
            visor.position.set(0, 1.78, 0.02);
            botGroup.add(visor);

            // Левая нога
            const legGeo = new THREE.BoxGeometry(0.25, 0.7, 0.25);
            const leftLeg = new THREE.Mesh(legGeo, pantsMat);
            leftLeg.position.set(-0.2, 0.35, 0);
            leftLeg.castShadow = true;
            botGroup.add(leftLeg);

            // Правая нога
            const rightLeg = leftLeg.clone();
            rightLeg.position.x = 0.2;
            botGroup.add(rightLeg);

            // Руки
            const armGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
            const leftArm = new THREE.Mesh(armGeo, clothesMat);
            leftArm.position.set(-0.45, 1.15, 0);
            leftArm.castShadow = true;
            botGroup.add(leftArm);

            const rightArm = leftArm.clone();
            rightArm.position.x = 0.45;
            botGroup.add(rightArm);
            
            // Направление спавна
            const angle = Math.random() * Math.PI * 2;
            const radius = 20 + Math.random() * 40;
            botGroup.position.set(Math.cos(angle)*radius, 0, Math.sin(angle)*radius);
            
            botGroup.userData = { 
                health: 100, 
                lastShot: 0, 
                id: i,
                leftLeg: leftLeg,
                rightLeg: rightLeg,
                leftArm: leftArm,
                rightArm: rightArm,
                animOffset: Math.random() * 10
            };
            
            scene.add(botGroup);
            bots.push(botGroup);
        }
    }

    function shoot() {
        if(currentAmmo <= 0) {
            if (reloadMsg) {
                reloadMsg.innerText = "НАЖМИТЕ 'R' ДЛЯ ПЕРЕЗАРЯДКИ";
                reloadMsg.style.display = 'block';
                setTimeout(() => { if(reloadMsg) reloadMsg.style.display = 'none'; }, 1000);
            }
            return;
        }

        currentAmmo--;
        updateHUD();

        // Отдача оружия вверх
        if(gunMesh) {
            gunMesh.position.z += 0.05;
            gunMesh.rotation.x += 0.05;
        }
        camera.rotation.x += 0.015;

        // Вспышка выстрела
        if(muzzleFlash) {
            muzzleFlash.material.opacity = 1;
            setTimeout(() => { if(muzzleFlash) muzzleFlash.material.opacity = 0; }, 400);
        }

        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

        // Ищем попадание в группы ботов (проверяем все подобъекты)
        const intersects = raycaster.intersectObjects(scene.children, true);
        createBulletTrail(raycaster);

        for (let i = 0; i < intersects.length; i++) {
            let hitObj = intersects[i].object;
            // Ищем родительскую группу бота
            while (hitObj.parent && !bots.includes(hitObj)) {
                hitObj = hitObj.parent;
            }

            if (bots.includes(hitObj)) {
                hitObj.userData.health -= 35;
                
                // Эффект отлетания назад при попадании
                const hitDir = raycaster.ray.direction.clone().setY(0).normalize();
                hitObj.position.add(hitDir.multiplyScalar(0.4));
                
                if(hitObj.userData.health <= 0) {
                    killBot(hitObj);
                }
                break; // Пуля попала в одного, выходим
            }
        }
        
        if(currentAmmo === 0) reloadWeapon();
    }

    function createBulletTrail(raycaster) {
        const material = new THREE.LineBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0.8 });
        const points = [];
        const start = new THREE.Vector3(0.25, -0.22, -0.5).applyMatrix4(camera.matrixWorld);
        const end = raycaster.ray.at(60, new THREE.Vector3());
        points.push(start, end);
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(geometry, material);
        scene.add(line);
        setTimeout(() => scene.remove(line), 40);
    }

    function reloadWeapon() {
        if(isReloading || currentAmmo === maxAmmo || reserveAmmo <= 0) return;
        
        isReloading = true;
        if (reloadMsg) {
            reloadMsg.innerText = "ПЕРЕЗАРЯДКА...";
            reloadMsg.style.display = 'block';
        }
        
        if(gunMesh) {
            gunMesh.rotation.x = -0.8; 
            gunMesh.position.y = -0.4;
        }

        setTimeout(() => {
            const needed = maxAmmo - currentAmmo;
            const take = Math.min(needed, reserveAmmo);
            currentAmmo += take;
            reserveAmmo -= take;
            
            isReloading = false;
            if (reloadMsg) reloadMsg.style.display = 'none';
            if(gunMesh) {
                gunMesh.rotation.x = 0;
                gunMesh.position.set(0.25, -0.25, -0.5);
            }
            updateHUD();
        }, 1200);
    }

    function killBot(bot) {
        scene.remove(bot);
        bots = bots.filter(b => b !== bot);
        
        if (killFeed) {
            const feedItem = document.createElement('div');
            feedItem.className = 'feed-item';
            feedItem.innerHTML = `Вы уничтожили Бота 🎯`;
            killFeed.prepend(feedItem);
            setTimeout(() => feedItem.remove(), 3000);
        }

        if(bots.length === 0) {
            endGame(true);
        }
    }

    function botLogic(delta) {
        if (!controls) return;
        const playerPos = controls.getObject().position;
        const time = Date.now();

        bots.forEach(bot => {
            const dist = bot.position.distanceTo(playerPos);
            const speed = botDifficulty === 'easy' ? 12 : (botDifficulty === 'hard' ? 35 : 20);
            const accuracySpread = botDifficulty === 'easy' ? 0.4 : (botDifficulty === 'hard' ? 0.04 : 0.18);

            // Поворот бота лицом к игроку
            bot.lookAt(playerPos.x, bot.position.y, playerPos.z);

            if(dist > 12) {
                const dir = new THREE.Vector3().subVectors(playerPos, bot.position).normalize();
                dir.y = 0;
                bot.position.add(dir.multiplyScalar(speed * delta));

                // Анимация бега (машем ногами и руками)
                const animSpeed = time * 0.01 + bot.userData.animOffset;
                const wave = Math.sin(animSpeed);
                bot.userData.leftLeg.rotation.x = wave * 0.6;
                bot.userData.rightLeg.rotation.x = -wave * 0.6;
                bot.userData.leftArm.rotation.x = -wave * 0.4;
                bot.userData.rightArm.rotation.x = wave * 0.4;
            } else {
                // Стоит на месте и целится — ноги ровно
                bot.userData.leftLeg.rotation.x = 0;
                bot.userData.rightLeg.rotation.x = 0;
                bot.userData.leftArm.rotation.x = 0.2;
                bot.userData.rightArm.rotation.x = 0.2;
            }

            // Стрельба ботов
            if(dist < 35 && time - bot.userData.lastShot > (botDifficulty === 'hard' ? 700 : 1400)) {
                if(dist < 25 && Math.random() > (botDifficulty === 'easy' ? 0.65 : 0.25)) {
                    playerHealth -= (botDifficulty === 'hard' ? 20 : 10);
                    updateHUD();
                    
                    // Эффект покраснения интерфейса при получении урона
                    document.body.style.backgroundColor = '#330000';
                    setTimeout(() => document.body.style.backgroundColor = '#000', 80);

                    if(playerHealth <= 0) endGame(false);
