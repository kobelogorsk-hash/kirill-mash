<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Browser CS Prototype - Weapons & Verticality</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; background-color: #000; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; z-index: 5; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); pointer-events: none; }
        .ch-line { position: absolute; background: #0f0; box-shadow: 0 0 4px #0f0; }
        .ch-h { width: 100%; height: 2px; top: 9px; }
        .ch-v { height: 100%; width: 2px; left: 9px; }
        
        #hud-bottom { padding: 20px; display: flex; justify-content: space-between; color: white; text-shadow: 2px 2px 4px black; font-size: 28px; font-weight: bold; pointer-events: none; }
        #ammo-box { background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 5px; border-left: 4px solid #ff9900; }
        #health-box { background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 5px; color: #ff4444; border-left: 4px solid #ff4444; }
        #weapon-display { font-size: 16px; color: #aaa; margin-top: 5px; text-align: right; }
        
        #menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 10; }
        h1 { color: #ff9900; font-size: 44px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,153,0,0.3); text-align: center;}
        .panel { background: #1a1a1a; padding: 30px; border-radius: 10px; border: 1px solid #333; text-align: center; color: white; max-width: 500px; width: 100%; box-sizing: border-box; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .control-group { margin: 15px 0; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #aaa; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        select, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 5px; border: none; font-size: 16px; cursor: pointer; box-sizing: border-box; }
        select { background: #2b2b2b; color: white; border: 1px solid #444; }
        select:focus { border-color: #ff9900; outline: none; }
        
        button.start-btn { background: #ff9900; color: black; font-weight: bold; transition: 0.2s; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
        button.start-btn:hover { background: #ffb733; transform: scale(1.02); box-shadow: 0 0 15px rgba(255,153,0,0.4); }
        button.sec-btn { background: #333; color: white; border: 1px solid #444; transition: 0.2s; text-transform: uppercase; font-size: 14px;}
        button.sec-btn:hover { background: #444; }
        
        #reload-msg { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); color: #ff4444; font-size: 22px; font-weight: bold; display: none; text-shadow: 2px 2px 4px black; letter-spacing: 1px; }
        #kill-feed { position: absolute; top: 20px; right: 20px; text-align: right; color: white; text-shadow: 1px 1px 2px black; font-size: 16px; font-weight: bold; }
        .feed-item { margin-bottom: 5px; opacity: 1; transition: opacity 2s; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 3px; border-right: 4px solid #0f0; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="kill-feed"></div>
    <div id="crosshair">
        <div class="ch-line ch-h"></div>
        <div class="ch-line ch-v"></div>
    </div>
    <div id="reload-msg">НАЖМИТЕ 'R' ДЛЯ ПЕРЕЗАРЯДКИ</div>
    <div id="hud-bottom">
        <div id="health-box">HP: <span id="hp-val">100</span></div>
        <div id="ammo-box">
            <div><span id="ammo-val">30</span> / <span id="reserve-val">90</span></div>
            <div id="weapon-display">AK-47</div>
        </div>
    </div>
</div>

<div id="menu-overlay">
    <div class="panel" id="main-menu">
        <h1>CS: WEB PROTOTYPE</h1>
        
        <div class="control-group">
            <label>Карта</label>
            <select id="map-select">
                <option value="dust2_style">Dust II (С подиумом и А-плентом)</option>
                <option value="ice_style">Ice Map (Сложный Лабиринт)</option>
                <option value="city_style">City Block (Городские кварталы)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Оружие</label>
            <select id="weapon-select">
                <option value="ak47">AK-47 (Высокий урон, средняя скорость)</option>
                <option value="awp">AWP Sniper (Ваншот, продольная прокрутка)</option>
                <option value="p90">P90 SMG (Зажим, быстрый темп, слабый урон)</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Скин оружия</label>
            <select id="skin-select">
                <option value="default">Стандарт</option>
                <option value="gold">Золотой Дракон</option>
                <option value="neon">Неон Киберпанк</option>
            </select>
        </div>
        
        <button class="start-btn" onclick="startGame()">В БОЙ</button>
        <button class="sec-btn" onclick="toggleSettings(true)">Настройки игры</button>
        <p style="font-size: 11px; color: #666; margin-top: 10px;">WASD - Ходьба | ЛКМ - Огонь | R - Перезарядка</p>
    </div>

    <div class="panel" id="settings-menu" style="display: none;">
        <h1>НАСТРОЙКИ</h1>
        
        <div class="control-group">
            <label>Количество ботов</label>
            <select id="bot-count-select">
                <option value="2">2 Бота</option>
                <option value="4">4 Бота</option>
                <option value="6" selected>6 Ботов</option>
                <option value="10">10 Ботов</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Сложность ботов</label>
            <select id="difficulty-select">
                <option value="easy">Легкая</option>
                <option value="medium" selected>Средняя</option>
                <option value="hard">Сложная</option>
            </select>
        </div>
        
        <button class="start-btn" onclick="toggleSettings(false)">Сохранить и выйти</button>
    </div>

    <div class="panel" id="game-over-menu" style="display: none;">
        <h1 id="end-title">ИГРА ОКОНЧЕНА</h1>
        <p id="end-reason"></p>
        <button class="start-btn" onclick="location.reload()">В МЕНЮ</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

<script>
    let camera, scene, renderer, controls, cameraHolder;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let canJump = false;
    let prevTime = performance.now();
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    
    let isGameActive = false;
    let playerHealth = 100;
    let currentAmmo = 30, reserveAmmo = 90, maxAmmo = 30;
    let isReloading = false;
    let bots = [];
    let obstacles = []; // Хитбоксы для обычных стен/ящиков (AABB)
    let platforms = []; // Хитбоксы горизонтальных платформ и пандусов (подъемов)
    
    let gunMesh, muzzleFlash;
    let bobTime = 0, recoilY = 0; 
    let botDifficulty = 'medium', mapType = 'dust2_style', weaponSkin = 'default', botCount = 6;
    let currentWeapon = 'ak47';

    // База данных оружия
    const WEAPON_CONFIGS = {
        ak47: { name: 'AK-47', maxAmmo: 30, reserve: 90, damage: 35, fireRate: 140, recoil: 0.04, color: 0x4a2f13 },
        awp:  { name: 'AWP Sniper', maxAmmo: 5, reserve: 20, damage: 100, fireRate: 1200, recoil: 0.15, color: 0x1b4d22 },
        p90:  { name: 'P90 SMG', maxAmmo: 50, reserve: 150, damage: 18, fireRate: 70, recoil: 0.015, color: 0x333333 }
    };

    let lastFireTime = 0;

    const PLAYER_HEIGHT = 1.8;
    const PLAYER_SPEED = 85.0;
    const PLAYER_RADIUS = 0.6; 

    let uiAmmo, uiReserve, uiHP, reloadMsg, menuOverlay, mainMenu, settingsMenu, gameOverMenu, killFeed;

    function toggleSettings(show) {
        if (show) {
            mainMenu.style.display = 'none';
            settingsMenu.style.display = 'block';
        } else {
            mainMenu.style.display = 'block';
            settingsMenu.style.display = 'none';
        }
    }

    function startGame() {
        if (!controls) return;
        controls.lock();
        menuOverlay.style.display = 'none';
        isGameActive = true;

        mapType = document.getElementById('map-select').value;
        weaponSkin = document.getElementById('skin-select').value;
        botDifficulty = document.getElementById('difficulty-select').value;
        botCount = parseInt(document.getElementById('bot-count-select').value) || 6;
        currentWeapon = document.getElementById('weapon-select').value;

        // Конфигурируем выбранное оружие
        const wng = WEAPON_CONFIGS[currentWeapon];
        maxAmmo = wng.maxAmmo;
        currentAmmo = maxAmmo;
        reserveAmmo = wng.reserve;
        document.getElementById('weapon-display').innerText = wng.name;

        playerHealth = 100;
        isReloading = false;
        recoilY = 0;
        bots = [];
        obstacles = [];
        platforms = [];
        updateHUD();
        
        while(scene.children.length > 0){ 
            scene.remove(scene.children[0]); 
        }

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(40, 100, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        buildMap();
        spawnBots();
        createWeaponModel();
    }

    function init() {
        uiAmmo = document.getElementById('ammo-val');
        uiReserve = document.getElementById('reserve-val');
        uiHP = document.getElementById('hp-val');
        reloadMsg = document.getElementById('reload-msg');
        menuOverlay = document.getElementById('menu-overlay');
        mainMenu = document.getElementById('main-menu');
        settingsMenu = document.getElementById('settings-menu');
        gameOverMenu = document.getElementById('game-over-menu');
        killFeed = document.getElementById('kill-feed');

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        cameraHolder = new THREE.Group();
        cameraHolder.add(camera);
        
        controls = new THREE.PointerLockControls(cameraHolder, document.body);
        
        controls.addEventListener('lock', () => {
            isGameActive = true;
            menuOverlay.style.display = 'none';
        });
        
        controls.addEventListener('unlock', () => {
            if(playerHealth > 0 && isGameActive) {
                isGameActive = false;
                mainMenu.style.display = 'block';
                settingsMenu.style.display = 'none';
                gameOverMenu.style.display = 'none';
                menuOverlay.style.display = 'flex';
            }
        });

        scene.add(cameraHolder);

        const onKeyDown = function (event) {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump) { velocity.y += 42; canJump = false; } break;
                case 'KeyR': reloadWeapon(); break;
            }
        };

        const onKeyUp = function (event) {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
            }
        };

        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);
        document.addEventListener('mousedown', () => { if(isGameActive && !isReloading) shoot(); });

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        window.addEventListener('resize', onWindowResize);
        animate();
    }

    function createGridTexture(color1, color2) {
        const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = color1; ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = color2; ctx.lineWidth = 4; ctx.strokeRect(0, 0, 256, 256);
        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(40, 40);
        return texture;
    }

    function buildMap() {
        let floorColor1, floorColor2, fogColor, wallColor;
        let blocks = []; // Геометрия стен/препятствий

        if (mapType === 'dust2_style') { 
            floorColor1 = '#dfb887'; floorColor2 = '#cda06c'; fogColor = 0xDFB887; wallColor = 0xc29966;
            
            // СТРУКТУРА DUST II (С А-Плентом, пандусом и укрытиями)
            // Платформа А-плента (Большой высокий блок, на который можно зайти)
            blocks.push({x: 25, y: 2, z: -20, w: 25, h: 4, d: 25, type: 'platform'}); 
            
            // Пандус (подъем) на Платформу А (Наклонный ящик)
            blocks.push({x: 25, y: 1, z: -2, w: 6, h: 2, d: 11, type: 'ramp', rotX: 0.2});

            // Стены Длины (Long) и коробки СТ-спавна
            blocks.push({x: 0, y: 3, z: -35, w: 4, h: 6, d: 30, type: 'wall'}); 
            blocks.push({x: 38, y: 2.5, z: 10, w: 4, h: 5, d: 40, type: 'wall'});
            blocks.push({x: -25, y: 2.5, z: -10, w: 6, h: 5, d: 20, type: 'wall'});

            // Защитные ящики на пленте А
            blocks.push({x: 20, y: 4.75, z: -25, w: 2.5, h: 1.5, d: 2.5, type: 'wall'}); 
            blocks.push({x: 28, y: 4.75, z: -15, w: 2, h: 1.5, d: 2, type: 'wall'});
            
            // Обычные ящики на земле (укрытия)
            blocks.push({x: 12, y: 1.25, z: 10, w: 2.5, h: 2.5, d: 2.5, type: 'wall'});
            blocks.push({x: -10, y: 1.5, z: -5, w: 3, h: 3, d: 3, type: 'wall'});

            // Точка спавна игрока (CT Base): чистая зона внизу
            if(cameraHolder) cameraHolder.position.set(5, PLAYER_HEIGHT, 25);

        } else if (mapType === 'ice_style') { 
            floorColor1 = '#ddf0ff'; floorColor2 = '#b0d8f8'; fogColor = 0xDEEEFA; wallColor = 0x88ccff;
            blocks = [
                {x: 12, y: 3.5, z: 12, w: 8, h: 7, d: 8, type: 'wall'},
                {x: -12, y: 3.5, z: 12, w: 8, h: 7, d: 8, type: 'wall'},
                {x: 12, y: 3.5, z: -12, w: 8, h: 7, d: 8, type: 'wall'},
                {x: -12, y: 3.5, z: -12, w: 8, h: 7, d: 8, type: 'wall'},
                {x: 0, y: 3, z: 35, w: 25, h: 6, d: 4, type: 'wall'},
                {x: 0, y: 3, z: -35, w: 25, h: 6, d: 4, type: 'wall'}
            ];
            if(cameraHolder) cameraHolder.position.set(0, PLAYER_HEIGHT, 0);
        } else { // City
            floorColor1 = '#222222'; floorColor2 = '#333333'; fogColor = 0x111111; wallColor = 0x555555;
            blocks = [
                {x: -25, y: 9, z: -25, w: 22, h: 18, d: 22, type: 'wall'},
                {x: 25, y: 12.5, z: -25, w: 22, h: 25, d: 22, type: 'wall'},
                {x: -25, y: 7, z: 25, w: 22, h: 14, d: 22, type: 'wall'},
                {x: 25, y: 10, z: 25, w: 22, h: 20, d: 22, type: 'wall'}
            ];
            if(cameraHolder) cameraHolder.position.set(0, PLAYER_HEIGHT, 0);
        }

        scene.background = new THREE.Color(fogColor);
        scene.fog = new THREE.FogExp2(fogColor, 0.015);

        // Земля
        const floorGeo = new THREE.PlaneGeometry(300, 300);
        const floorMat = new THREE.MeshStandardMaterial({ map: createGridTexture(floorColor1, floorColor2), roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Генерация блоков
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        blocks.forEach(b => {
            let mat;
            if (mapType === 'ice_style') {
                mat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.1, transparent: true, opacity: 0.85 });
            } else {
                mat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.7 });
            }

            const mesh = new THREE.Mesh(boxGeo, mat);
            mesh.position.set(b.x, b.y, b.z);
            mesh.scale.set(b.w, b.h, b.d);
            
            if (b.rotX) mesh.rotation.x = b.rotX;

            mesh.castShadow = true; mesh.receiveShadow = true;
            scene.add(mesh);

            // Сортировка хитбоксов для физики под ногами и коллизий стен
            if (b.type === 'platform' || b.type === 'ramp') {
                platforms.push(mesh);
            } else {
                obstacles.push(new THREE.Box3().setFromObject(mesh));
            }
        });

        velocity.set(0,0,0);
    }

    function checkPlayerCollision(nextPosition) {
        // Создаем хитбокс вокруг игрока
        const playerBox = new THREE.Box3(
            new THREE.Vector3(nextPosition.x - PLAYER_RADIUS, nextPosition.y - PLAYER_HEIGHT, nextPosition.z - PLAYER_RADIUS),
            new THREE.Vector3(nextPosition.x + PLAYER_RADIUS, nextPosition.y, nextPosition.z + PLAYER_RADIUS)
        );
        // Проверка столкновения со стенами
        for (let i = 0; i < obstacles.length; i++) {
            if (playerBox.intersectsBox(obstacles[i])) return true;
        }
        return false;
    }

    function createWeaponModel() {
        for (let i = camera.children.length - 1; i >= 0; i--) camera.remove(camera.children[i]);

        gunMesh = new THREE.Group();
        
        let color = WEAPON_CONFIGS[currentWeapon].color;
        if(weaponSkin === 'gold') color = 0xFFD700;
        if(weaponSkin === 'neon') color = 0x00ffff;

        // Корпус ствола (размеры зависят от выбранного пулемета)
        let wW = currentWeapon === 'p90' ? 0.12 : 0.07;
        let wL = currentWeapon === 'awp' ? 0.7 : 0.45;

        const bodyGeo = new THREE.BoxGeometry(wW, 0.11, wL);
        const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        gunMesh.add(body);
        
        const barrelGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.4);
        const barrelMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.7 });
        const barrel = new THREE.Mesh(barrelGeo, barrelMat);
        barrel.rotation.x = Math.PI / 2;
        barrel.position.set(0, 0.02, -(wL/2 + 0.2));
        gunMesh.add(barrel);

        // Для AWP делаем оптический прицел
        if(currentWeapon === 'awp') {
            const scopeGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.25);
            const scope = new THREE.Mesh(scopeGeo, barrelMat);
            scope.rotation.x = Math.PI / 2;
            scope.position.set(0, 0.08, -0.05);
            gunMesh.add(scope);
        }

        const flashGeo = new THREE.SphereGeometry(0.06, 8, 8);
        const flashMat = new THREE.MeshBasicMaterial({ color: 0xffbb00, transparent: true, opacity: 0 });
        muzzleFlash = new THREE.Mesh(flashGeo, flashMat);
        muzzleFlash.position.set(0, 0.02, -(wL/2 + 0.4));
        gunMesh.add(muzzleFlash);

        gunMesh.position.set(0.24, -0.24, -0.45);
        camera.add(gunMesh);
    }

    function spawnBots() {
        for(let i = 0; i < botCount; i++) {
            const botGroup = new THREE.Group();
            const clothesMat = new THREE.MeshStandardMaterial({ color: mapType === 'dust2_style' ? 0x8b4513 : 0x2e59a8 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.4), clothesMat);
            torso.position.y = 1.15; botGroup.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), skinMat);
            head.position.y = 1.75; botGroup.add(head);

            const legGeo = new THREE.BoxGeometry(0.24, 0.7, 0.24);
            const leftLeg = new THREE.Mesh(legGeo, new THREE.MeshStandardMaterial({color:0x222222}));
            leftLeg.position.set(-0.18, 0.35, 0); botGroup.add(leftLeg);
            const rightLeg = leftLeg.clone(); rightLeg.position.x = 0.18; botGroup.add(rightLeg);

            // Точки спавна ботов
            if (mapType === 'dust2_style') {
                // Часть ботов спавнится на возвышенном А-пленте, часть внизу на длине
                if(i % 2 === 0) {
                    botGroup.position.set(20 + Math.random()*8, 4.1, -15 - Math.random()*8); // На платформе
                } else {
                    botGroup.position.set(30, 0, 5 + Math.random()*15); // На длине
                }
            } else {
                const angle = Math.random() * Math.PI * 2;
                const radius = 20 + Math.random() * 30;
                botGroup.position.set(Math.cos(angle)*radius, 0, Math.sin(angle)*radius);
            }
            
            botGroup.userData = { health: 100, lastShot: 0, leftLeg, rightLeg, animOffset: Math.random()*5 };
            scene.add(botGroup);
            bots.push(botGroup);
        }
    }

    function shoot() {
        const now = performance.now();
        const conf = WEAPON_CONFIGS[currentWeapon];

        if(now - lastFireTime < conf.fireRate) return; // Ограничение темпа стрельбы
        lastFireTime = now;

        if(currentAmmo <= 0) {
            reloadMsg.innerText = "НАЖМИТЕ 'R' ДЛЯ ПЕРЕЗАРЯДКИ";
            reloadMsg.style.display = 'block';
            setTimeout(() => reloadMsg.style.display = 'none', 1000);
            return;
        }

        currentAmmo--;
        updateHUD();

        if(gunMesh) { gunMesh.position.z += 0.07; gunMesh.rotation.x += conf.recoil * 1.5; }
        recoilY += conf.recoil;

        if(muzzleFlash) { muzzleFlash.material.opacity = 1; setTimeout(() => muzzleFlash.material.opacity = 0, 50); }

        const raycaster = new THREE.Raycaster();
        // Небольшой разброс при зажиме
        const spreadX = (Math.random() - 0.5) * (conf.recoil * 0.8);
        const spreadY = (Math.random() - 0.5) * (conf.recoil * 0.8);
        raycaster.setFromCamera(new THREE.Vector2(spreadX, spreadY), camera);

        const intersects = raycaster.intersectObjects(scene.children, true);
        createBulletTrail(raycaster);

        for (let i = 0; i < intersects.length; i++) {
            let hitObj = intersects[i].object;
            while (hitObj.parent && !bots.includes(hitObj)) hitObj = hitObj.parent;

            if (bots.includes(hitObj)) {
                hitObj.userData.health -= conf.damage;
                hitObj.position.add(raycaster.ray.direction.clone().setY(0).normalize().multiplyScalar(0.3));
                
                if(hitObj.userData.health <= 0) killBot(hitObj);
                break;
            }
        }
        if(currentAmmo === 0) reloadWeapon();
    }

    function createBulletTrail(raycaster) {
        const material = new THREE.LineBasicMaterial({ color: 0xffdd44, transparent: true, opacity: 0.7 });
        const points = [new THREE.Vector3(0.24, -0.22, -0.5).applyMatrix4(camera.matrixWorld), raycaster.ray.at(80, new THREE.Vector3())];
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), material);
        scene.add(line);
        setTimeout(() => scene.remove(line), 35);
    }

    function reloadWeapon() {
        if(isReloading || currentAmmo === maxAmmo || reserveAmmo <= 0) return;
        isReloading = true;
        reloadMsg.innerText = "ПЕРЕЗАРЯДКА..."; reloadMsg.style.display = 'block';
        
        if(gunMesh) { gunMesh.rotation.x = -0.7; gunMesh.position.y = -0.4; }

        setTimeout(() => {
            const take = Math.min(maxAmmo - currentAmmo, reserveAmmo);
            currentAmmo += take; reserveAmmo -= take;
            isReloading = false; reloadMsg.style.display = 'none';
            if(gunMesh) { gunMesh.rotation.x = 0; gunMesh.position.set(0.24, -0.24, -0.45); }
            updateHUD();
        }, currentWeapon === 'awp' ? 2200 : 1300); // Снайперка перезаряжается дольше
    }

    function killBot(bot) {
        scene.remove(bot);
        bots = bots.filter(b => b !== bot);
        const feedItem = document.createElement('div');
        feedItem.className = 'feed-item';
        feedItem.innerHTML = `Вы убрали Бота [${WEAPON_CONFIGS[currentWeapon].name}] 🎯`;
        killFeed.prepend(feedItem);
        setTimeout(() => feedItem.remove(), 3000);
        if(bots.length === 0) endGame(true);
    }

    function botLogic(delta) {
        if (!cameraHolder) return;
        const playerPos = cameraHolder.position;
        const time = Date.now();

        bots.forEach(bot => {
            const dist = bot.position.distanceTo(playerPos);
            const speed = botDifficulty === 'easy' ? 10 : (botDifficulty === 'hard' ? 30 : 18);

            bot.lookAt(playerPos.x, bot.position.y, playerPos.z);

            if(dist > 6) {
                const dir = new THREE.Vector3().subVectors(playerPos, bot.position).normalize();
                dir.y = 0; // Движение по горизонтали
                bot.position.add(dir.multiplyScalar(speed * delta));

                const wave = Math.sin(time * 0.01 + bot.userData.animOffset);
                bot.userData.leftLeg.rotation.x = wave * 0.6;
                bot.userData.rightLeg.rotation.x = -wave * 0.6;
            }

            if(dist < 12 && time - bot.userData.lastShot > (botDifficulty === 'hard' ? 800 : 1600)) {
                playerHealth -= (botDifficulty === 'hard' ? 15 : 8);
                updateHUD();
                document.body.style.backgroundColor = '#300'; setTimeout(() => document.body.style.backgroundColor = '#000', 60);
                if(playerHealth <= 0) endGame(false);
                bot.userData.lastShot = time;
            }
        });
    }

    function updateHUD() {
        uiAmmo.innerText = currentAmmo;
        uiReserve.innerText = reserveAmmo;
        uiHP.innerText = playerHealth;
        uiHP.style.color = playerHealth < 35 ? '#ff2222' : 'white';
    }

    function endGame(win) {
        isGameActive = false; controls.unlock();
        gameOverMenu.style.display = 'block';
        mainMenu.style.display = 'none'; settingsMenu.style.display = 'none';
        menuOverlay.style.display = 'flex';
        document.getElementById('end-title').innerText = win ? "ПОБЕДА!" : "ВАС УБИЛИ";
        document.getElementById('end-title').style.color = win ? "#00ff00" : "#ff0000";
        document.getElementById('end-reason').innerText = win ? "Карта полностью зачищена." : "Попробуйте другое оружие или смените тактику!";
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        const time = performance.now();
        const delta = (time - prevTime) / 1000;

        if (controls && controls.isLocked && isGameActive && cameraHolder) {
            // Физика затухания скорости
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 9.8 * 22.0 * delta; // Сила тяжести (гравитация)

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            if (moveForward || moveBackward) velocity.z -= direction.z * PLAYER_SPEED * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * PLAYER_SPEED * delta;

            const oldPos = cameraHolder.position.clone();

            // Движение по X с коллизией
            controls.moveRight(-velocity.x * delta);
            if (checkPlayerCollision(cameraHolder.position)) cameraHolder.position.x = oldPos.x;

            // Движение по Z с коллизией
            controls.moveForward(-velocity.z * delta);
            if (checkPlayerCollision(cameraHolder.position)) cameraHolder.position.z = oldPos.z;
            
            // ГРАВИТАЦИЯ И СКАНИРОВАНИЕ ВЫСОТЫ (Платформы и пандусы)
            cameraHolder.position.y += (velocity.y * delta);

            let groundY = 0; // Уровень земли по умолчанию
            
            // Луч вниз из ног игрока для проверки платформ и пандусов под ним
            const raycasterDown = new THREE.Raycaster(cameraHolder.position, new THREE.Vector3(0, -1, 0));
            const platformIntersects = raycasterDown.intersectObjects(platforms);

            if (platformIntersects.length > 0 && platformIntersects[0].distance <= PLAYER_HEIGHT + 0.2) {
                // Если под ногами платформа или пандус, адаптируем высоту игрока под нее
                groundY = cameraHolder.position.y - platformIntersects[0].distance + PLAYER_HEIGHT;
            }

            if (cameraHolder.position.y <= groundY + PLAYER_HEIGHT) {
                velocity.y = 0;
                cameraHolder.position.y = groundY + PLAYER_HEIGHT;
                canJump = true;
            }

            // Плавное гашение отдачи прицела
            recoilY = THREE.MathUtils.lerp(recoilY, 0, 0.1);
            camera.rotation.x = recoilY;

            // Анимация оружия (покачивание при ходьбе)
            if(gunMesh) {
                gunMesh.position.z = THREE.MathUtils.lerp(gunMesh.position.z, -0.45, 0.1);
                gunMesh.rotation.x = THREE.MathUtils.lerp(gunMesh.rotation.x, 0, 0.1);
                if ((moveForward || moveBackward || moveLeft || moveRight) && canJump) {
                    bobTime += delta * 13;
                    gunMesh.position.y = -0.24 + Math.sin(bobTime) * 0.012;
                } else {
                    gunMesh.position.y = THREE.MathUtils.lerp(gunMesh.position.y, -0.24, 0.1);
                }
            }

            botLogic(delta);
        }
        prevTime = time;
        if (renderer && scene && camera) renderer.render(scene, camera);
    }

    window.onload = init;
</script>
</body>
</html>
