<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Browser CS Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); pointer-events: none; }
        .ch-line { position: absolute; background: #0f0; }
        .ch-h { width: 100%; height: 2px; top: 9px; }
        .ch-v { height: 100%; width: 2px; left: 9px; }
        
        #hud-bottom { padding: 20px; display: flex; justify-content: space-between; color: white; text-shadow: 1px 1px 2px black; font-size: 24px; font-weight: bold; }
        #ammo-box { background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 5px; }
        #health-box { background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 5px; color: #ff4444; }
        
        #menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 10; }
        h1 { color: #ff9900; font-size: 48px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .panel { background: #222; padding: 30px; border-radius: 10px; border: 1px solid #444; text-align: center; color: white; max-width: 500px; }
        .control-group { margin: 20px 0; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #aaa; }
        select, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 5px; border: none; font-size: 16px; cursor: pointer; }
        select { background: #333; color: white; border: 1px solid #555; }
        button.start-btn { background: #ff9900; color: black; font-weight: bold; transition: 0.2s; }
        button.start-btn:hover { background: #ffb733; transform: scale(1.02); }
        
        #reload-msg { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); color: #ff4444; font-size: 20px; font-weight: bold; display: none; text-shadow: 1px 1px 2px black; }
        #kill-feed { position: absolute; top: 20px; right: 20px; text-align: right; color: white; text-shadow: 1px 1px 2px black; font-size: 14px; }
        .feed-item { margin-bottom: 5px; opacity: 1; transition: opacity 2s; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="kill-feed"></div>
    <div id="crosshair">
        <div class="ch-line ch-h"></div>
        <div class="ch-line ch-v"></div>
    </div>
    <div id="reload-msg">НАЖМИТЕ 'R' ДЛЯ ПЕРЕЗАРЯДКИ</div>
    <div id="hud-bottom">
        <div id="health-box">HP: <span id="hp-val">100</span></div>
        <div id="ammo-box"><span id="ammo-val">30</span> / <span id="reserve-val">90</span></div>
    </div>
</div>

<div id="menu-overlay">
    <div class="panel" id="main-menu">
        <h1>CS: WEB PROTOTYPE</h1>
        <div class="control-group">
            <label>Карта</label>
            <select id="map-select">
                <option value="dust2_style">Dust II Style (Пустыня)</option>
                <option value="ice_style">Ice Map (Лед)</option>
                <option value="city_style">City Block (Город)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Скин оружия</label>
            <select id="skin-select">
                <option value="default">Стандарт (Черный)</option>
                <option value="gold">Золотой Дракон</option>
                <option value="neon">Неон Киберпа
