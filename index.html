<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Browser CS Prototype - Crouch Added</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; background-color: #000; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; z-index: 5; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); pointer-events: none; }
        .ch-line { position: absolute; background: #0f0; box-shadow: 0 0 4px #0f0; }
        .ch-h { width: 100%; height: 2px; top: 9px; }
        .ch-v { height: 100%; width: 2px; left: 9px; }
        
        #awp-scope { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
        #scope-lens { position: absolute; top: 50%; left: 50%; width: 500px; height: 500px; transform: translate(-50%, -50%); border: 3px solid rgba(0,0,0,0.9); border-radius: 50%; box-shadow: 0 0 0 2000px rgba(0,0,0,0.85); }
        #scope-cross-h { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: black; }
        #scope-cross-v { position: absolute; left: 50%; top: 0; width: 1px; height: 100%; background: black; }
        
        #hud-bottom { padding: 20px; display: flex; justify-content: space-between; color: white; text-shadow: 2px 2px 4px black; font-size: 28px; font-weight: bold; pointer-events: none; }
        #ammo-box { background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 5px; border-left: 4px solid #ff9900; }
        #health-box { background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 5px; color: #ff4444; border-left: 4px solid #ff4444; }
        #weapon-display { font-size: 16px; color: #aaa; margin-top: 5px; text-align: right; }
        
        #menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 10; }
        h1 { color: #ff9900; font-size: 44px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,153,0,0.3); text-align: center;}
        .panel { background: #1a1a1a; padding: 30px; border-radius: 10px; border: 1px solid #333; text-align: center; color: white; max-width: 500px; width: 100%; box-sizing: border-box; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .control-group { margin: 15px 0; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #aaa; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        select, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 5px; border: none; font-size: 16px; cursor: pointer; box-sizing: border-box; }
        select { background: #2b2b2b; color: white; border: 1px solid #444; }
        select:focus { border-color: #ff9900; outline: none; }
        
        button.start-btn { background: #ff9900; color: black; font-weight: bold; transition: 0.2s; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
        button.start-btn:hover { background: #ffb733; transform: scale(1.02); box-shadow: 0 0 15px rgba(255,153,0,0.4); }
        button.sec-btn { background: #333; color: white; border: 1px solid #444; transition: 0.2s; text-transform: uppercase; font-size: 14px;}
        button.sec-btn:hover { background: #444; }
        
        #reload-msg { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); color: #ff4444; font-size: 22px; font-weight: bold; display: none; text-shadow: 2px 2px 4px black; letter-spacing: 1px; }
        #kill-feed { position: absolute; top: 20px; right: 20px; text-align: right; color: white; text-shadow: 1px 1px 2px black; font-size: 16px; font-weight: bold; }
        .feed-item { margin-bottom: 5px; opacity: 1; transition: opacity 2s; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 3px; border-right: 4px solid #ff3333; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="kill-feed"></div>
    <div id="crosshair">
        <div class="ch-line ch-h"></div>
        <div class="ch-line ch-v"></div>
    </div>
    <div id="awp-scope">
        <div id="scope-lens">
            <div id="scope-cross-h"></div>
            <div id="scope-cross-v"></div>
        </div>
    </div>
    <div id="reload-msg">ПЕРЕЗАРЯДКА...</div>
    <div id="hud-bottom">
        <div id="health-box">HP: <span id="hp-val">100</span></div>
        <div id="ammo-box">
            <div><span id="ammo-val">30</span> / <span id="reserve-val">90</span></div>
            <div id="weapon-display">AK-47</div>
        </div>
    </div>
</div>

<div id="menu-overlay">
    <div class="panel" id="main-menu">
        <h1>CS 2: WEB PROTOTYPE</h1>
        
        <div class="control-group">
            <label>Карта</label>
            <select id="map-select">
                <option value="dust2_style">Dust II (Песочный камуфляж)</option>
                <option value="cache">de_cache (Индустриальный камень)</option>
                <option value="night_cache">de_cache_night (Ночной Чернобыль)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Оружие</label>
            <select id="weapon-select">
                <option value="ak47">AK-47 (Зажимной автомат)</option>
                <option value="awp">AWP Sniper (Прицел на ПКМ)</option>
                <option value="p90">P90 SMG (Бешеный зажим)</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Скин оружия</label>
            <select id="skin-select">
                <option value="default">Стандарт</option>
                <option value="gold">Золотой Век</option>
                <option value="neon">Асимов Киберпанк</option>
            </select>
        </div>
        
        <button class="start-btn" onclick="startGame()">В БОЙ</button>
        <button class="sec-btn" onclick="toggleSettings(true)">Настройки</button>
        <p style="font-size: 11px; color: #aaa; margin-top: 10px;">Зажимай Left Ctrl, чтобы присесть и стрелять точнее!</p>
    </div>

    <div class="panel" id="settings-menu" style="display: none;">
        <h1>НАСТРОЙКИ</h1>
        
        <div class="control-group">
            <label>Количество ботов</label>
            <select id="bot-count-select">
                <option value="2">2 Бота</option>
                <option value="4">4 Бота</option>
                <option value="6" selected>6 Ботов</option>
                <option value="10">10 Ботов</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Сложность ботов</label>
            <select id="difficulty-select">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Global Elite</option>
            </select>
        </div>
        
        <button class="start-btn" onclick="toggleSettings(false)">Сохранить</button>
    </div>

    <div class="panel" id="game-over-menu" style="display: none;">
        <h1 id="end-title">КОНЕЦ РАУНДА</h1>
        <p id="end-reason"></p>
        <button class="start-btn" onclick="location.reload()">В МЕНЮ</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

<script>
    let camera, scene, renderer, controls, cameraHolder;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let canJump = false;
    let isCrouching = false; // Состояние приседания
    let prevTime = performance.now();
    const velocity = new THREE.Vector3();
    
    let isGameActive = false;
    let playerHealth = 100;
    let currentAmmo = 30, reserveAmmo = 90, maxAmmo = 30;
    let isReloading = false;
    let reloadTimer = 0; 
    let bots = [];
    let obstacles = []; 
    let platforms = []; 
    
    let gunMesh, muzzleFlash;
    let gunBasePos = new THREE.Vector3(0.24, -0.24, -0.55); 
    let currentGunPos = new THREE.Vector3().copy(gunBasePos);
    
    let recoilActivePitch = 0; 
    let continuousShots = 0; 
    
    let botDifficulty = 'medium', mapType = 'dust2_style', weaponSkin = 'default', botCount = 6;
    let currentWeapon = 'ak47';
    let isMouseDown = false; 
    let isScoped = false; 

    const WEAPON_CONFIGS = {
        ak47: { name: 'AK-47', maxAmmo: 30, reserve: 90, damage: 34, fireRate: 130, recoilUp: 0.006, recoilSide: 0.003, color: 0x4a2f13, auto: true },
        awp:  { name: 'AWP Sniper', maxAmmo: 5, reserve: 20, damage: 115, fireRate: 1300, recoilUp: 0.06, recoilSide: 0.0, color: 0x1b4d22, auto: false },
        p90:  { name: 'P90 SMG', maxAmmo: 50, reserve: 150, damage: 19, fireRate: 65, recoilUp: 0.002, recoilSide: 0.0015, color: 0x333333, auto: true }
    };

    let lastFireTime = 0;
    
    // Параметры высоты игрока
    const STAND_HEIGHT = 1.8;
    const CROUCH_HEIGHT = 1.0;
    let currentPlayerHeight = STAND_HEIGHT;

    const PLAYER_SPEED_STAND = 12.0; 
    const PLAYER_SPEED_CROUCH = 5.0; // Медленное перемещение в приседе

    const PLAYER_RADIUS = 0.6; 
    const BOT_RADIUS = 0.55; 

    let uiAmmo, uiReserve, uiHP, reloadMsg, menuOverlay, mainMenu, settingsMenu, gameOverMenu, killFeed, chStandard, chScope;

    function generateWallTexture(type) {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');

        if (type === 'sand') {
            ctx.fillStyle = '#e0be91'; ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 30000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#cca576' : '#ebd4b0';
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
            }
            ctx.strokeStyle = 'rgba(150,110,80,0.2)'; ctx.lineWidth = 3;
            for(let j=0; j<4; j++) { ctx.beginPath(); ctx.moveTo(0, j*128); ctx.lineTo(512, j*128); ctx.stroke(); }
        } else {
            ctx.fillStyle = type === 'stone_dark' ? '#252c25' : '#707870'; ctx.fillRect(0, 0, 512, 512);
            ctx.strokeStyle = type === 'stone_dark' ? '#141a14' : '#4b524b'; ctx.lineWidth = 5;
            let rows = 12; let cols = 6; let rh = 512 / rows; let cw = 512 / cols;
            for(let r = 0; r < rows; r++) {
                ctx.beginPath(); ctx.moveTo(0, r*rh); ctx.lineTo(512, r*rh); ctx.stroke();
                let offset = (r % 2) * (cw / 2);
                for(let c = 0; c <= cols + 1; c++) { ctx.beginPath(); ctx.moveTo(c*cw - offset, r*rh); ctx.lineTo(c*cw - offset, (r+1)*rh); ctx.stroke(); }
            }
            for(let i=0; i<400; i++) { ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(Math.random()*512, Math.random()*512, Math.random()*10+2, Math.random()*10+2); }
        }
        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(2, 2);
        return texture;
    }

    function toggleSettings(show) {
        if (show) { mainMenu.style.display = 'none'; settingsMenu.style.display = 'block'; } 
        else { mainMenu.style.display = 'block'; settingsMenu.style.display = 'none'; }
    }

    function toggleZoom(forceOff = false) {
        if(currentWeapon !== 'awp' || forceOff) {
            isScoped = false; camera.fov = 75; camera.updateProjectionMatrix();
            if(chStandard) chStandard.style.display = 'block';
            if(chScope) chScope.style.display = 'none';
            if(gunMesh) gunMesh.visible = true;
            return;
        }
        isScoped = !isScoped;
        camera.fov = isScoped ? 18 : 75; 
        camera.updateProjectionMatrix();
        chStandard.style.display = isScoped ? 'none' : 'block';
        chScope.style.display = isScoped ? 'block' : 'none';
        if(gunMesh) gunMesh.visible = !isScoped; 
    }

    function startGame() {
        if (!controls) return;
        
        mapType = document.getElementById('map-select').value;
        weaponSkin = document.getElementById('skin-select').value;
        botDifficulty = document.getElementById('difficulty-select').value;
        botCount = parseInt(document.getElementById('bot-count-select').value) || 6;
        currentWeapon = document.getElementById('weapon-select').value;

        const wng = WEAPON_CONFIGS[currentWeapon];
        maxAmmo = wng.maxAmmo; currentAmmo = maxAmmo; reserveAmmo = wng.reserve;
        document.getElementById('weapon-display').innerText = wng.name;

        playerHealth = 100; isReloading = false; toggleZoom(true); 
        recoilActivePitch = 0; continuousShots = 0; isCrouching = false; currentPlayerHeight = STAND_HEIGHT;
        bots = []; obstacles = []; platforms = [];
        updateHUD();
        
        for(let i = scene.children.length - 1; i >= 0; i--){
            if(scene.children[i] !== cameraHolder) scene.remove(scene.children[i]);
        }

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(40, 100, 20); scene.add(dirLight);

        buildMap();
        spawnBots();
        createWeaponModel();
        
        if(cameraHolder) cameraHolder.position.set(5, currentPlayerHeight, 25);
        velocity.set(0, 0, 0);
        
        controls.lock();
        menuOverlay.style.display = 'none';
        isGameActive = true;
    }

    function init() {
        uiAmmo = document.getElementById('ammo-val'); uiReserve = document.getElementById('reserve-val'); uiHP = document.getElementById('hp-val');
        reloadMsg = document.getElementById('reload-msg'); menuOverlay = document.getElementById('menu-overlay');
        mainMenu = document.getElementById('main-menu'); settingsMenu = document.getElementById('settings-menu');
        gameOverMenu = document.getElementById('game-over-menu'); killFeed = document.getElementById('kill-feed');
        chStandard = document.getElementById('crosshair'); chScope = document.getElementById('awp-scope');

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        cameraHolder = new THREE.Group(); cameraHolder.add(camera);
        cameraHolder.position.set(5, STAND_HEIGHT, 25); scene.add(cameraHolder);
        
        controls = new THREE.PointerLockControls(camera, document.body);
        
        controls.addEventListener('lock', () => { if(!isGameActive) startGame(); else menuOverlay.style.display = 'none'; });
        controls.addEventListener('unlock', () => {
            if(playerHealth > 0 && isGameActive) {
                isGameActive = false; isMouseDown = false;
                mainMenu.style.display = 'block'; menuOverlay.style.display = 'flex';
            }
        });

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump && !isCrouching) { velocity.y += 10; canJump = false; } break;
                case 'KeyR': reloadWeapon(); break;
                case 'ControlLeft': isCrouching = true; break; // Сесть
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
                case 'ControlLeft': isCrouching = false; break; // Встать
            }
        });

        document.addEventListener('mousedown', (e) => {
            if(!isGameActive) return;
            if(e.button === 0) { isMouseDown = true; if(!WEAPON_CONFIGS[currentWeapon].auto) shoot(); } 
            else if(e.button === 2) toggleZoom();
        });
        document.addEventListener('mouseup', (e) => { if(e.button === 0) { isMouseDown = false; continuousShots = 0; } });

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio); renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        window.addEventListener('resize', onWindowResize);
        animate();
    }

    function buildMap() {
        let floorColor = '#cda06c', fogColor = 0xDFB887, texType = 'sand';
        let blocks = []; 

        if (mapType === 'dust2_style') { 
            texType = 'sand'; floorColor = '#d1b28c'; fogColor = 0xe8ccaa;
            blocks.push({x: 25, y: 2, z: -20, w: 25, h: 4, d: 25, type: 'platform'}); 
            blocks.push({x: 25, y: 1, z: -2, w: 6, h: 2, d: 11, type: 'ramp', rotX: 0.2});
            blocks.push({x: 0, y: 3, z: -35, w: 4, h: 6, d: 30, type: 'wall'}); 
            blocks.push({x: 38, y: 2.5, z: 10, w: 4, h: 5, d: 40, type: 'wall'});
            blocks.push({x: -25, y: 2.5, z: -10, w: 6, h: 5, d: 20, type: 'wall'});
        } 
        else { 
            texType = (mapType === 'cache') ? 'stone' : 'stone_dark';
            floorColor = mapType === 'cache' ? '#5a615a' : '#181f18';
            fogColor = mapType === 'cache' ? '#9fb09f' : '#050a05';

            blocks = [
                {x: 0, y: 4, z: 0, w: 18, h: 8, d: 20, type: 'wall'}, 
                {x: 0, y: 7, z: 10, w: 10, h: 2, d: 1, type: 'wall'},
                {x: 14, y: 2, z: -15, w: 2, h: 4, d: 12, type: 'wall'},
                {x: -22, y: 3, z: 5, w: 8, h: 6, d: 25, type: 'wall'},
                {x: 22, y: 1.5, z: 15, w: 12, h: 3, d: 12, type: 'platform'},
                {x: 20, y: 4, z: 15, w: 3, h: 2, d: 3, type: 'wall'},
                {x: 0, y: 5, z: -40, w: 80, h: 10, d: 4, type: 'wall'},
                {x: 0, y: 5, z: 40, w: 80, h: 10, d: 4, type: 'wall'},
                {x: -40, y: 5, z: 0, w: 4, h: 10, d: 80, type: 'wall'},
                {x: 40, y: 5, z: 0, w: 4, h: 10, d: 80, type: 'wall'}
            ];
        }

        scene.background = new THREE.Color(fogColor);
        scene.fog = new THREE.FogExp2(fogColor, 0.012);

        const floorGeo = new THREE.PlaneGeometry(300, 300);
        const floorMat = new THREE.MeshStandardMaterial({ color: floorColor, roughness: 1.0 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2; scene.add(floor);
        platforms.push(floor);

        const wallTex = generateWallTexture(texType);
        const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.8 });

        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        blocks.forEach(b => {
            const mesh = new THREE.Mesh(boxGeo, wallMat);
            mesh.position.set(b.x, b.y, b.z);
            mesh.scale.set(b.w, b.h, b.d);
            if (b.rotX) mesh.rotation.x = b.rotX;
            scene.add(mesh);
            if (b.type === 'platform') platforms.push(mesh);
            obstacles.push(new THREE.Box3().setFromObject(mesh));
        });
    }

    function checkCollision(position, radius, height) {
        const boundingBox = new THREE.Box3(
            new THREE.Vector3(position.x - radius, position.y, position.z - radius),
            new THREE.Vector3(position.x + radius, position.y + height, position.z + radius)
        );
        for (let i = 0; i < obstacles.length; i++) {
            if (boundingBox.intersectsBox(obstacles[i])) return true;
        }
        return false;
    }

    function checkPlayerWithBots(nextPosition) {
        if(checkCollision(nextPosition, PLAYER_RADIUS, currentPlayerHeight)) return true;
        for(let i = 0; i < bots.length; i++) {
            let bot = bots[i];
            let distXZ = Math.sqrt(Math.pow(nextPosition.x - bot.position.x, 2) + Math.pow(nextPosition.z - bot.position.z, 2));
            if (distXZ < (PLAYER_RADIUS + BOT_RADIUS)) return true; 
        }
        return false;
    }

    function createWeaponModel() {
        for (let i = camera.children.length - 1; i >= 0; i--) camera.remove(camera.children[i]);

        gunMesh = new THREE.Group();
        let color = WEAPON_CONFIGS[currentWeapon].color;
        if(weaponSkin === 'gold') color = 0xFFD700;
        if(weaponSkin === 'neon') color = 0xff00ff;

        let wW = currentWeapon === 'p90' ? 0.12 : 0.07;
        let wL = currentWeapon === 'awp' ? 0.7 : 0.45;

        const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(wW, 0.11, wL), new THREE.MeshStandardMaterial({ color: color, roughness: 0.4 }));
        gunMesh.add(bodyMesh);
        
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.4), new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.7 }));
        barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.02, -(wL/2 + 0.2));
        gunMesh.add(barrel);

        if(currentWeapon === 'awp') {
            const scope = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.25), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            scope.rotation.x = Math.PI / 2; scope.position.set(0, 0.08, -0.05);
            gunMesh.add(scope);
        }

        muzzleFlash = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffbb00, transparent: true, opacity: 0 }));
        muzzleFlash.position.set(0, 0.02, -(wL/2 + 0.4)); gunMesh.add(muzzleFlash);

        currentGunPos.copy(gunBasePos); gunMesh.position.copy(currentGunPos);
        camera.add(gunMesh);
    }

    function spawnBots() {
        for(let i = 0; i < botCount; i++) {
            const botGroup = new THREE.Group();
            const clothesMat = new THREE.MeshStandardMaterial({ color: mapType.includes('cache') ? 0x3d473d : 0x735135 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.4), clothesMat);
            torso.position.y = 1.15; botGroup.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), skinMat);
            head.position.y = 1.75; 
            head.name = "bot_head"; 
            botGroup.add(head);

            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.7, 0.24), new THREE.MeshStandardMaterial({color:0x1c1c1c}));
            leftLeg.position.set(-0.18, 0.35, 0); botGroup.add(leftLeg);
            const rightLeg = leftLeg.clone(); rightLeg.position.x = 0.18; botGroup.add(rightLeg);

            const botGun = new THREE.Group();
            const gBody = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.09, 0.45), new THREE.MeshStandardMaterial({ color: 0x222222 }));
            const gBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.25), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            gBarrel.rotation.x = Math.PI / 2; gBarrel.position.set(0, 0.02, -0.3);
            botGun.add(gBody, gBarrel);
            botGun.position.set(0.3, 1.1, -0.3);
            botGroup.add(botGun);

            const bFlash = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0 }));
            bFlash.position.set(0.3, 1.12, -0.45);
            botGroup.add(bFlash);

            botGroup.position.set((Math.random() - 0.5) * 40, 0, (Math.random() - 0.5) * 40);
            botGroup.userData = { health: 100, lastShot: 0, leftLeg, rightLeg, animOffset: Math.random()*5, velocityY: 0, flashMesh: bFlash, headMesh: head };
            
            scene.add(botGroup);
            bots.push(botGroup);
        }
    }

    function shoot() {
        if(isReloading) return;
        const now = performance.now();
        const conf = WEAPON_CONFIGS[currentWeapon];
        if(now - lastFireTime < conf.fireRate) return; 
        lastFireTime = now;

        if(currentAmmo <= 0) { reloadWeapon(); return; }
        currentAmmo--; updateHUD();

        if(currentWeapon === 'awp' && isScoped) toggleZoom(true);

        continuousShots++;
        
        // Модификатор точности: в приседе отдача уменьшается в 1.8 раза
        let crouchModifier = isCrouching ? 0.55 : 1.0;
        let factor = Math.min(continuousShots, 10); 
        
        let currentRecoilUp = (conf.recoilUp * (1 + factor * 0.2)) * crouchModifier;
        let currentRecoilSide = ((Math.random() - 0.5) * conf.recoilSide * (factor * 0.2)) * crouchModifier;
        
        camera.rotation.x += currentRecoilUp;
        camera.rotation.y += currentRecoilSide;
        
        recoilActivePitch += currentRecoilUp;

        if(gunMesh && !isScoped) {
            gunMesh.position.z = gunBasePos.z + currentRecoilUp * 0.8; 
            gunMesh.position.y = gunBasePos.y + (currentRecoilUp * 0.15); 
            gunMesh.rotation.x = -currentRecoilUp * 0.8; 
        }
        
        if(muzzleFlash && !isScoped) { muzzleFlash.material.opacity = 1; setTimeout(() => muzzleFlash.material.opacity = 0, 40); }

        const raycaster = new THREE.Raycaster();
        let targetScreenX = 0;
        let targetScreenY = 0;

        if (!isScoped) {
            targetScreenY += (factor * 0.005) * crouchModifier; 
            targetScreenX += (Math.random() - 0.5) * (factor * 0.004) * crouchModifier;
        }

        raycaster.setFromCamera(new THREE.Vector2(targetScreenX, targetScreenY), camera);

        const intersects = raycaster.intersectObjects(scene.children, true);
        createBulletTrail(raycaster);

        for (let i = 0; i < intersects.length; i++) {
            let hitMesh = intersects[i].object;
            let isHeadshot = (hitMesh.name === "bot_head"); 

            let hitBot = hitMesh;
            while (hitBot.parent && !bots.includes(hitBot)) hitBot = hitBot.parent;

            if (bots.includes(hitBot)) {
                if (isHeadshot) {
                    hitBot.userData.health = 0; 
                    killBot(hitBot, true);
                } else {
                    hitBot.userData.health -= conf.damage; 
                    if(hitBot.userData.health <= 0) killBot(hitBot, false);
                }
                break;
            }
        }
    }

    function createBulletTrail(raycaster) {
        if (isScoped) return;
        const material = new THREE.LineBasicMaterial({ color: 0xffdd44, transparent: true, opacity: 0.4 });
        const points = [new THREE.Vector3(0.24, -0.22, -0.5).applyMatrix4(camera.matrixWorld), raycaster.ray.at(40, new THREE.Vector3())];
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), material);
        scene.add(line); setTimeout(() => scene.remove(line), 25);
    }

    function reloadWeapon() {
        if(isReloading || currentAmmo === maxAmmo || reserveAmmo <= 0) return;
        isReloading = true; reloadTimer = 0; reloadMsg.style.display = 'block';
        if(isScoped) toggleZoom(true);

        setTimeout(() => {
            const take = Math.min(maxAmmo - currentAmmo, reserveAmmo);
            currentAmmo += take; reserveAmmo -= take;
            isReloading = false; reloadMsg.style.display = 'none'; updateHUD();
        }, 1400);
    }

    function killBot(bot, headshot) {
        scene.remove(bot); bots = bots.filter(b => b !== bot);
        const feedItem = document.createElement('div'); feedItem.className = 'feed-item';
        
        if (headshot) {
            feedItem.innerHTML = `💥 Минус Бот [${WEAPON_CONFIGS[currentWeapon].name}] [Headshot] 💀`;
            feedItem.style.borderRight = "4px solid #ffcc00";
        } else {
            feedItem.innerHTML = `Минус Бот [${WEAPON_CONFIGS[currentWeapon].name}] 🎯`;
            feedItem.style.borderRight = "4px solid #ff3333";
        }
        
        killFeed.prepend(feedItem); setTimeout(() => feedItem.remove(), 2500);
        if(bots.length === 0) endGame(true);
    }

    function botLogic(delta) {
        if (!cameraHolder) return;
        const playerPos = cameraHolder.position;
        const time = Date.now();

        for (let i = 0; i < bots.length; i++) {
            for (let j = i + 1; j < bots.length; j++) {
                let b1 = bots[i]; let b2 = bots[j];
                let dist = b1.position.distanceTo(b2.position);
                let minDist = BOT_RADIUS * 2;
                if (dist < minDist) {
                    let pushDir = new THREE.Vector3().subVectors(b1.position, b2.position).normalize();
                    pushDir.y = 0; let overlap = minDist - dist;
                    b1.position.add(pushDir.clone().multiplyScalar(overlap * 0.5));
                    b2.position.sub(pushDir.clone().multiplyScalar(overlap * 0.5));
                }
            }
        }

        bots.forEach(bot => {
            let isMoving = false;
            const dist = bot.position.distanceTo(playerPos);
            const speed = botDifficulty === 'easy' ? 4 : (botDifficulty === 'hard' ? 8.5 : 6);

            bot.lookAt(playerPos.x, bot.position.y, playerPos.z);

            bot.userData.velocityY -= 28.0 * delta; 
            bot.position.y += bot.userData.velocityY * delta;

            let botGround = 0;
            const raycasterBot = new THREE.Raycaster(new THREE.Vector3(bot.position.x, bot.position.y + 0.5, bot.position.z), new THREE.Vector3(0, -1, 0));
            const botIntersects = raycasterBot.intersectObjects(platforms);
            if (botIntersects.length > 0) botGround = (bot.position.y + 0.5) - botIntersects[0].distance;
            if (bot.position.y <= botGround) { bot.position.y = botGround; bot.userData.velocityY = 0; }

            if (dist > 4.0 && bot.position.y <= botGround + 0.05) {
                const dir = new THREE.Vector3().subVectors(playerPos, bot.position).normalize();
                dir.y = 0; 
                const nextBotPos = bot.position.clone().add(dir.clone().multiplyScalar(speed * delta));
                if (!checkCollision(nextBotPos, BOT_RADIUS, 1.8)) {
                    bot.position.copy(nextBotPos);
                    isMoving = true;
                }
            }

            if (isMoving) {
                const wave = Math.sin(time * 0.01 + bot.userData.animOffset);
                bot.userData.leftLeg.rotation.x = wave * 0.6; bot.userData.rightLeg.rotation.x = -wave * 0.6;
            }

            if(dist < 18 && time - bot.userData.lastShot > (botDifficulty === 'hard' ? 700 : 1500)) {
                playerHealth -= (botDifficulty === 'hard' ? 12 : 6); updateHUD();
                if(bot.userData.flashMesh) {
                    bot.userData.flashMesh.material.opacity = 1;
                    setTimeout(() => { if(bot.userData.flashMesh) bot.userData.flashMesh.material.opacity = 0; }, 50);
                }
                if(playerHealth <= 0) endGame(false);
                bot.userData.lastShot = time;
            }
        });
    }

    function updateHUD() {
        uiAmmo.innerText = currentAmmo; uiReserve.innerText = reserveAmmo; uiHP.innerText = playerHealth;
    }

    function endGame(win) {
        isGameActive = false; isMouseDown = false; controls.unlock();
        gameOverMenu.style.display = 'block'; mainMenu.style.display = 'none'; menuOverlay.style.display = 'flex';
        document.getElementById('end-title').innerText = win ? "ПОБЕДА!" : "РАУНД ПРОИГРАН";
        document.getElementById('end-title').style.color = win ? "#00ff00" : "#ff0000";
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        const time = performance.now();
        let delta = (time - prevTime) / 1000;
        if(delta > 0.1) delta = 0.1; 

        if (controls && controls.isLocked && isGameActive && cameraHolder) {
            
            if(isMouseDown && WEAPON_CONFIGS[currentWeapon].auto) shoot();

            if (!isMouseDown && recoilActivePitch > 0) {
                let recovery = delta * 0.15; 
                camera.rotation.x -= recovery;
                recoilActivePitch -= recovery;
                if(recoilActivePitch < 0) recoilActivePitch = 0;
            }

            velocity.y -= 28.0 * delta; 

            const frontVector = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const sideVector = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            frontVector.y = 0; frontVector.normalize();
            sideVector.y = 0; sideVector.normalize();

            const moveVector = new THREE.Vector3();
            if (moveForward) moveVector.add(frontVector);
            if (moveBackward) moveVector.sub(frontVector);
            if (moveRight) moveVector.add(sideVector);
            if (moveLeft) moveVector.sub(sideVector);
            moveVector.normalize();
            
            // Динамический расчет скорости: в приседе двигаемся медленнее
            let currentMoveSpeed = isCrouching ? PLAYER_SPEED_CROUCH : PLAYER_SPEED_STAND;
            moveVector.multiplyScalar(currentMoveSpeed * delta);

            const oldPos = cameraHolder.position.clone();
            
            cameraHolder.position.x += moveVector.x;
            if (checkPlayerWithBots(cameraHolder.position)) cameraHolder.position.x = oldPos.x;

            cameraHolder.position.z += moveVector.z;
            if (checkPlayerWithBots(cameraHolder.position)) cameraHolder.position.z = oldPos.z;

            cameraHolder.position.y += (velocity.y * delta);

            let currentGround = 0;
            const raycasterDown = new THREE.Raycaster(cameraHolder.position, new THREE.Vector3(0, -1, 0));
            const platformIntersects = raycasterDown.intersectObjects(platforms);
            if (platformIntersects.length > 0) currentGround = cameraHolder.position.y - platformIntersects[0].distance;

            // ПЛАВНАЯ СМЕНА ВЫСОТЫ КАМЕРЫ ПРИ ПРИСЕДАНИИ
            let targetHeight = isCrouching ? CROUCH_HEIGHT : STAND_HEIGHT;
            currentPlayerHeight = THREE.MathUtils.lerp(currentPlayerHeight, targetHeight, delta * 10);

            if (cameraHolder.position.y <= currentGround + currentPlayerHeight) {
                velocity.y = 0; 
                cameraHolder.position.y = currentGround + currentPlayerHeight; 
                canJump = true;
            }

            if(gunMesh) {
                if (isReloading) {
                    reloadTimer += delta * Math.PI; 
                    gunMesh.position.y = gunBasePos.y - Math.sin(reloadTimer * 1.1) * 0.4;
                    gunMesh.position.z = gunBasePos.z - Math.sin(reloadTimer * 1.1) * 0.1;
                    gunMesh.rotation.z = Math.sin(reloadTimer * 1.1) * 0.5;
                } else {
                    gunMesh.position.z = THREE.MathUtils.lerp(gunMesh.position.z, gunBasePos.z, 0.14);
                    gunMesh.position.y = THREE.MathUtils.lerp(gunMesh.position.y, gunBasePos.y, 0.14);
                    gunMesh.rotation.x = THREE.MathUtils.lerp(gunMesh.rotation.x, 0, 0.14);
                    gunMesh.rotation.z = THREE.MathUtils.lerp(gunMesh.rotation.z, 0, 0.14);
                }
            }

            botLogic(delta);
        }
        
        prevTime = time;
        if (renderer && scene && camera) renderer.render(scene, camera);
    }

    document.addEventListener('contextmenu', e => e.preventDefault());
    window.onload = init;
</script>
</body>
