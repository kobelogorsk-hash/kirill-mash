<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Browser CS Prototype - Final Fix</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; background-color: #000; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); pointer-events: none; }
        .ch-line { position: absolute; background: #0f0; box-shadow: 0 0 4px #0f0; }
        .ch-h { width: 100%; height: 2px; top: 9px; }
        .ch-v { height: 100%; width: 2px; left: 9px; }
        
        #hud-bottom { padding: 20px; display: flex; justify-content: space-between; color: white; text-shadow: 2px 2px 4px black; font-size: 28px; font-weight: bold; }
        #ammo-box { background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 5px; border-left: 4px solid #ff9900; }
        #health-box { background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 5px; color: #ff4444; border-left: 4px solid #ff4444; }
        
        #menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 10; }
        h1 { color: #ff9900; font-size: 48px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,153,0,0.3); }
        .panel { background: #1a1a1a; padding: 30px; border-radius: 10px; border: 1px solid #333; text-align: center; color: white; max-width: 500px; width: 100%; box-sizing: border-box; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .control-group { margin: 20px 0; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #aaa; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        select, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 5px; border: none; font-size: 16px; cursor: pointer; box-sizing: border-box; }
        select { background: #2b2b2b; color: white; border: 1px solid #444; }
        select:focus { border-color: #ff9900; outline: none; }
        button.start-btn { background: #ff9900; color: black; font-weight: bold; transition: 0.2s; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
        button.start-btn:hover { background: #ffb733; transform: scale(1.02); box-shadow: 0 0 15px rgba(255,153,0,0.4); }
        
        #reload-msg { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); color: #ff4444; font-size: 22px; font-weight: bold; display: none; text-shadow: 2px 2px 4px black; letter-spacing: 1px; }
        #kill-feed { position: absolute; top: 20px; right: 20px; text-align: right; color: white; text-shadow: 1px 1px 2px black; font-size: 16px; font-weight: bold; }
        .feed-item { margin-bottom: 5px; opacity: 1; transition: opacity 2s; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 3px; border-right: 4px solid #0f0; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="kill-feed"></div>
    <div id="crosshair">
        <div class="ch-line ch-h"></div>
        <div class="ch-line ch-v"></div>
    </div>
